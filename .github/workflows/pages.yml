name: Pages

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "*.css"
      - korzem.js
      - komponenty/**
      - strony/**
      - dane/**
      - pl/**
      - robots.txt
      - sitemap.xml
      - .github/workflows/pages.yml
      - .github/scripts/prepare-pages.js
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare site
        run: node .github/scripts/prepare-pages.js

      - name: Minify library
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          npx --yes terser@5 korzem.js \
            --compress passes=2 \
            --mangle \
            --preamble "/*! korzem.js ${SHORT_SHA} | https://github.com/${GITHUB_REPOSITORY} */" \
            --source-map "url='korzem.min.js.map',includeSources" \
            --output site/korzem.min.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
