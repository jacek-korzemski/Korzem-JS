name: CDN

on:
  push:
    branches: [main]
    paths:
      - korzem.js
      - .github/workflows/cdn.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cdn
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Minify
        run: |
          set -euo pipefail
          mkdir -p dist
          SHORT_SHA="${GITHUB_SHA::7}"
          npx --yes terser@5 korzem.js \
            --compress passes=2 \
            --mangle \
            --preamble "/*! korzem.js ${SHORT_SHA} | https://github.com/${GITHUB_REPOSITORY} */" \
            --source-map "url='korzem.min.js.map',includeSources" \
            --output dist/korzem.min.js
          cp korzem.js dist/korzem.js
          echo "Minified ${SHORT_SHA}"

      - name: Publish cdn branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          git init -b cdn
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Minify ${GITHUB_SHA}"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          gh auth setup-git
          git push --force origin HEAD:cdn
          curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@cdn/korzem.min.js" || true
          curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@cdn/korzem.js" || true
