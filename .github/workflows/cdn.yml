name: CDN

on:
  push:
    branches: [main]
    paths:
      - korzem.js
      - .github/workflows/cdn.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cdn
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Minify
        run: |
          set -euo pipefail
          mkdir -p dist
          SHORT_SHA="${GITHUB_SHA::7}"
          npx --yes terser@5 korzem.js \
            --compress passes=2 \
            --mangle \
            --preamble "/*! korzem.js ${SHORT_SHA} | https://github.com/${GITHUB_REPOSITORY} */" \
            --source-map "url='korzem.min.js.map',includeSources" \
            --output dist/korzem.min.js
          cp korzem.js dist/korzem.js
          touch dist/.nojekyll
          node <<'NODE'
          const fs = require("fs");
          const size = fs.statSync("dist/korzem.min.js").size;
          const sha = process.env.GITHUB_SHA.slice(0, 7);
          const repo = process.env.GITHUB_REPOSITORY;
          const name = repo.split("/")[1];
          const owner = process.env.GITHUB_REPOSITORY_OWNER;
          const pages = `https://${owner}.github.io/${name}/korzem.min.js`;
          const jsdelivr = `https://cdn.jsdelivr.net/gh/${repo}@cdn/korzem.min.js`;
          fs.writeFileSync("dist/index.html", `<!DOCTYPE html>
          <html lang="pl">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>korzem.js</title>
            <style>
              body { font: 16px/1.5 system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; color: #18181b; }
              a { color: #c2410c; }
              pre { background: #f4f4f5; padding: 1rem; overflow: auto; }
              code { font-size: 0.9em; }
            </style>
          </head>
          <body>
            <p><a href="https://github.com/${repo}">korzem.js</a></p>
            <h1>CDN</h1>
            <p>Minifikacja z <code>${sha}</code> · ${size} bajtów.</p>
            <p>GitHub Pages</p>
            <pre>&lt;script src="${pages}" defer&gt;&lt;/script&gt;</pre>
            <p>jsDelivr</p>
            <pre>&lt;script src="${jsdelivr}" defer&gt;&lt;/script&gt;</pre>
            <p>
              <a href="korzem.min.js">korzem.min.js</a>
              · <a href="korzem.js">korzem.js</a>
              · <a href="korzem.min.js.map">mapa</a>
            </p>
          </body>
          </html>
          `);
          console.log("Minified", size, "bytes", sha);
          NODE

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          include-hidden-files: true

      - name: Publish cdn branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          git init -b cdn
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Minify ${GITHUB_SHA}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: bearer ${GH_TOKEN}" \
            push --force "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:cdn
          curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@cdn/korzem.min.js" || true
          curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@cdn/korzem.js" || true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
